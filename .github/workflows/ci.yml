name: CI

on:
  pull_request:
    branches: [main, 'feat/canvas-*', 'feat/613-detached-compare']
  push:
    branches: [main]

jobs:
  test:
    name: Test, lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate translation catalogs
        run: node scripts/check-i18n.mjs "$CATALOG_BASE"
        env:
          CATALOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Run tests
        run: npm test -- --run

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build
