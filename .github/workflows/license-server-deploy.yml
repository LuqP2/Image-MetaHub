name: Deploy license server

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending D1 migrations before deployment"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: license-server-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: license-server-production
    defaults:
      run:
        working-directory: packages/license-server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LICENSE_SIGNING_PRIVATE_KEY: ${{ secrets.LICENSE_SIGNING_PRIVATE_KEY }}
      LICENSE_SERVER_ADMIN_TOKEN: ${{ secrets.LICENSE_SERVER_ADMIN_TOKEN }}
      EMAIL_LOOKUP_PEPPER: ${{ secrets.EMAIL_LOOKUP_PEPPER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker tooling
        run: npm install --ignore-scripts

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID LICENSE_SIGNING_PRIVATE_KEY LICENSE_SERVER_ADMIN_TOKEN EMAIL_LOOKUP_PEPPER; do
            test -n "${!name:-}" || { echo "$name is missing." >&2; exit 1; }
          done

      - name: Apply D1 migrations
        if: ${{ inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply image-metahub-licenses --remote

      - name: Deploy Worker code
        run: npx wrangler deploy

      - name: Configure Worker secrets without logging values
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f .production-secrets.json' EXIT
          jq -n \
            --arg signingKey "$LICENSE_SIGNING_PRIVATE_KEY" \
            --arg adminToken "$LICENSE_SERVER_ADMIN_TOKEN" \
            --arg emailPepper "$EMAIL_LOOKUP_PEPPER" \
            '{LICENSE_SIGNING_PRIVATE_KEY: $signingKey, LICENSE_SERVER_ADMIN_TOKEN: $adminToken, EMAIL_LOOKUP_PEPPER: $emailPepper}' \
            > .production-secrets.json
          npx wrangler secret bulk .production-secrets.json
