name: Create license key

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Purchaser email"
        required: true
        type: string
      plan:
        description: "Entitlement plan"
        required: true
        default: "lifetime"
        type: choice
        options:
          - lifetime
          - monthly
          - annual
      expires_at:
        description: "ISO-8601 entitlement expiry (required for monthly/annual)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  create-license:
    runs-on: ubuntu-latest
    env:
      IMH_LICENSE_SERVER_URL: ${{ vars.LICENSE_SERVER_URL }}
      LICENSE_SERVER_ADMIN_TOKEN: ${{ secrets.LICENSE_SERVER_ADMIN_TOKEN }}
      LICENSE_EMAIL: ${{ inputs.email }}
      LICENSE_PLAN: ${{ inputs.plan }}
      LICENSE_EXPIRES_AT: ${{ inputs.expires_at }}
      LICENSE_OUTPUT_PATH: license.txt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate workflow configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${IMH_LICENSE_SERVER_URL:-}" || { echo "LICENSE_SERVER_URL repository variable is missing." >&2; exit 1; }
          test -n "${LICENSE_SERVER_ADMIN_TOKEN:-}" || { echo "LICENSE_SERVER_ADMIN_TOKEN repository secret is missing." >&2; exit 1; }
          if [ "${LICENSE_PLAN}" != "lifetime" ] && [ -z "${LICENSE_EXPIRES_AT:-}" ]; then
            echo "expires_at is required for monthly and annual licenses." >&2
            exit 1
          fi

      - name: Create license without logging credentials
        run: node scripts/generateLicenseKey.mjs

      - name: Upload short-lived license artifact
        uses: actions/upload-artifact@v4
        with:
          name: license-key
          path: license.txt
          if-no-files-found: error
          retention-days: 1

      - name: Summarize
        shell: bash
        run: |
          {
            echo "## License created"
            echo "Plan: ${LICENSE_PLAN}"
            echo "Credentials are available only in the one-day artifact."
          } >> "$GITHUB_STEP_SUMMARY"
