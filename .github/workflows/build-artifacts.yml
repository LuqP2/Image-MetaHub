name: Build Artifacts (No Release)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'linux'
        type: choice
        options:
          - linux
          - windows
          - macos
          - all
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
        type: string

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all' }}
    env:
      IMH_LICENSE_SERVER_URL: ${{ vars.LICENSE_SERVER_URL }}
      IMH_LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_SERVER_PUBLIC_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure public license client
        run: node scripts/configureLicenseClient.mjs

      - name: Build Linux AppImage
        run: |
          echo "Building Linux AppImage..."
          npm run build
          npx electron-builder --linux --publish=never
          echo "Linux build completed!"
          ls -la dist-electron/

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist-electron/*.AppImage
            dist-electron/latest-linux.yml
          retention-days: 30

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    if: ${{ github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all' }}
    env:
      IMH_LICENSE_SERVER_URL: ${{ vars.LICENSE_SERVER_URL }}
      IMH_LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_SERVER_PUBLIC_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure public license client
        run: node scripts/configureLicenseClient.mjs

      - name: Build Windows installer
        shell: bash
        run: |
          echo "Building Windows installer..."
          npm run build
          npx electron-builder --win --publish=never
          echo "Windows build completed!"
          ls -la dist-electron/

      - name: Upload Windows installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist-electron/*.exe
            dist-electron/*.exe.blockmap
            dist-electron/latest.yml
          retention-days: 30

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    if: ${{ github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all' }}
    env:
      IMH_LICENSE_SERVER_URL: ${{ vars.LICENSE_SERVER_URL }}
      IMH_LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_SERVER_PUBLIC_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure public license client
        run: node scripts/configureLicenseClient.mjs

      - name: Build macOS App
        run: |
          echo "Building macOS app..."
          npm run build
          npx electron-builder --mac --publish=never
          echo "macOS build completed!"
          ls -la dist-electron/

      - name: Smoke test packaged detached viewer
        run: |
          SMOKE_IMAGE="$RUNNER_TEMP/imh-detached-viewer-smoke.png"
          SMOKE_LOG="$RUNNER_TEMP/imh-detached-viewer-smoke.log"
          node -e "require('fs').writeFileSync(process.argv[1], Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=', 'base64'))" "$SMOKE_IMAGE"

          if [[ "$(uname -m)" == "arm64" ]]; then
            APP_PATH="dist-electron/mac-arm64/Image MetaHub.app"
          else
            APP_PATH="dist-electron/mac/Image MetaHub.app"
          fi

          if ! GITHUB_ACTIONS=true IMH_PACKAGED_DETACHED_VIEWER_SMOKE_IMAGE="$SMOKE_IMAGE" "$APP_PATH/Contents/MacOS/Image MetaHub" > "$SMOKE_LOG" 2>&1; then
            cat "$SMOKE_LOG"
            exit 1
          fi

          cat "$SMOKE_LOG"
          grep -F "[packaged-detached-viewer-smoke] renderer-ready" "$SMOKE_LOG"

      - name: Upload macOS app as artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            dist-electron/*.dmg
            dist-electron/*.dmg.blockmap
            dist-electron/latest-mac.yml
          retention-days: 30
