name: Import issued legacy licenses

on:
  workflow_dispatch:
    inputs:
      emails:
        description: "Historical purchaser emails, one per line"
        required: true
        type: string

permissions:
  contents: read

jobs:
  import-legacy:
    runs-on: ubuntu-latest
    env:
      # This historical secret is intentionally restricted to the one-time
      # migration job. The v2 Worker and desktop application never receive it.
      IMH_LICENSE_SECRET: ${{ secrets.IMH_LICENSE_SECRET }}
      IMH_LEGACY_EMAILS: ${{ inputs.emails }}
      IMH_LICENSE_SERVER_URL: ${{ vars.LICENSE_SERVER_URL }}
      LICENSE_SERVER_ADMIN_TOKEN: ${{ secrets.LICENSE_SERVER_ADMIN_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate migration configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${IMH_LICENSE_SECRET:-}" || { echo "Historical migration secret is missing." >&2; exit 1; }
          test -n "${IMH_LICENSE_SERVER_URL:-}" || { echo "LICENSE_SERVER_URL repository variable is missing." >&2; exit 1; }
          test -n "${LICENSE_SERVER_ADMIN_TOKEN:-}" || { echo "LICENSE_SERVER_ADMIN_TOKEN repository secret is missing." >&2; exit 1; }

      - name: Reconstruct and import issued licenses directly
        run: node scripts/generateLegacyLicenseMap.mjs
